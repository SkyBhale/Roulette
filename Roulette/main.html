<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
@property --rotate {
  syntax: "<angle>";
  initial-value: 132deg;
  inherits: false;
}

:root {
  --card-height: 65vh;
  --card-width: calc(var(--card-height) / 1.5);
}

/* General page styling */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-image: url('banner.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 16px;
  line-height: 1.5;
}

.glass-card {
    display: flex;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      height: 100%;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card {
  background: #191c29;
  height: 90vh; /* Set height to 90% of the viewport height */
  width: calc(30% - 20px); /* Responsive width */
  padding: 20px;
  position: relative;
  border-radius: 6px;
  justify-content: center;
  align-items: center;
  text-align: center;
  display: flex;
  flex-direction: column;
  font-size: 1.5em;
  color: rgb(88 199 250 / 0%);
  cursor: pointer;
  font-family: cursive;
  margin: 10px;
  overflow: hidden;
}

.card-content {
  overflow-y: auto;
  max-height: calc(90vh - 40px); /* Use 90% of viewport height minus 40px */
  width: 100%;
}
.card table th, .card table td {
  color: #fff !important;
}
.card:hover {
  color: rgb(88 199 250 / 100%);
  transition: color 1s;
}
h2{
    color: rgb(88 199 250 / 100%);
    align-items: center;
}

a {
  color: #212534;
  text-decoration: none;
  font-family: sans-serif;
  font-weight: bold;
  margin-top: 2rem;
}

/* Additional styles */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid #fff;
}

th {
  background-color: #007BFF;
  color: white;
}

.image-tile {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  margin-top: 20px;
}

.image-tile img {
  width: 100%;
  height: auto;
  max-width: 200px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.image-tile button, .delete-button, #close-modal {
  padding: 10px 20px;
  background-color: #007BFF;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.button {
      background-color: darkblue;
        color: white;
        border: none;
        padding: 15px 30px;
        cursor: pointer;
        font-size: 16px;
        border-radius: 20px;
        transition: all 0.3s;
      }

    .button:hover {
      background-color: #0056b3;
    }


.delete-button {
  background-color: #dc3545;
}

.delete-button:hover {
  background-color: #c82333;
}

.modal-container {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  height: 100vh;
  display: none;
  justify-content: center;
  align-items: center;
}
.modal-container {
  /* Add a glassy background effect */
  background-color: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  padding: 20px;
}
#winner-modal-container {
  background-image: url(bg.jpg);
  background-size: cover;
  background-position: center;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  height: 100vh;
  display: none;
  justify-content: center;
}
#winner-modal-container {
  /* Add a glassy background effect */
  background-color: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  padding: 20px;
}

#winner-options {
    background: rgba(255, 255, 255, 0.2); /* Semi-transparent background */
    border: 1px solid rgba(255, 255, 255, 0.5); /* Light border */
    border-radius: 8px; /* Rounded corners */
    color: #fff; /* Text color */
    padding: 10px; /* Padding for better spacing */
    font-size: 16px; /* Font size */
    backdrop-filter: blur(10px); /* Blur effect */
    -webkit-backdrop-filter: blur(10px); /* For Safari */
    appearance: none; /* Remove default styling */
    cursor: pointer; /* Pointer cursor */
    transition: background 0.3s ease; /* Transition effect */
}

#winner-options:hover {
    background: rgba(255, 255, 255, 0.3); /* Darker background on hover */
}

#winner-options option {
    background: rgba(255, 255, 255, 0.9); /* Background for options */
    color: #000; /* Text color for options */
}

#winners-list {
    max-height: 300px; /* Adjust the height as needed */
    overflow-y: auto;  /* Enable vertical scrolling */
    margin: 0;         /* Remove default margin */
    padding: 0;        /* Remove default padding */
    list-style-type: none; /* Remove bullet points */
    align-items: left;
}

.modal-container section {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
}
.loader {
  display: flex;
  justify-content: space-between;
  width: 300px;
  margin: 20px auto;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}



/* Responsive Design */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }
  .card {
    width: 100%;
    margin: 10px 0;
  }
}
#remains {
    display: block; /* Ensures the label takes up a full line */
    margin-top: 10px; /* Adds space above the label */
    font-size: 16px; /* Sets the font size */
    font-weight: bold; /* Makes the text bold */
    color: #333; /* Sets the text color */
    background-color: #f0f0f0; /* Sets a background color */
    padding: 10px; /* Adds padding around the text */
    border: 1px solid #ccc; /* Adds a border around the label */
    border-radius: 5px; /* Rounds the corners of the border */
    width: fit-content; /* Makes the width fit the content */
    position: relative; /* Keeps the label in normal flow */
    /* Optionally, you can use position: fixed; to keep it at a fixed position on the viewport */
}

#num-winners {
  width: 200px;
  height: 50px;
  padding: 10px;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  color: #fff;
  background-color: #343a40;
}

#num-winners::placeholder {
  color: #666;
}

#num-winners:focus {
  outline: none;
  box-shadow: 0 0 5px #343a40;
}

.loader {
  display: flex;
  justify-content: space-between;
  width: 100px;
  margin: 20px auto;
}

.dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: #007BFF;
  animation: loading 1s infinite;
  animation-delay: calc(0.1s * var(--i));
}

@keyframes loading {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

.glassy-modal {
    backdrop-filter: blur(10px);
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.glassy-modal::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    z-index: -1;
}

    </style>
</head>
<body>
    <!-- Flexbox container for cards -->
    <div class="glass-card">
        <!-- Card 1: Participants List -->
        <div class="card">
          <h2>Participants List</h2>
          <div class="card-content">
              <table>
                  <thead>
                      <tr>
                          <th>No.</th>
                          <th>Name</th>
                      </tr>
                  </thead>
                  <tbody id="participantsTable">
                  </tbody>
              </table>
          </div>
          <label id="remains" for="remains"></label>
      </div>

        <!-- Card 2: Image display with a button -->
        <div class="card">
            <h2>Randomizer</h2>
            <div class="card-content">
            <div class="image-tile">
                <img src="minergy.png" alt="Randomize">
                <main class="wrapper">
                    <input type="number" id="num-winners" placeholder="How many Winners?">
                    <br>
                </main>
                <br>
                <select id="winner-options" required>
                        <option value="" disabled selected>Merry Christmas</option>
                        <option value="consolation">Consolation</option>
                        <option value="minor">Minor</option>
                        <option value="major">Major</option>
                        <option value="grand">Grand</option>
                </select>
                    <br>
                <button class="button" id="champ">Select the Winners</button>
            </div>
        </div>
        </div>

        <!-- Card 3: Winners List -->
        <div class="card">
            <h2>Winners List</h2>
            <div class="card-content">
            <table>
                <thead>
                    <tr>
                      <th>No.</th>
                      <th>Name</th>
                      <th>Category</th>
                    </tr>
                </thead>
                <tbody id="winnersTable">
                </tbody>
            </table>
            </div>
            <button class="button" onclick="printContent()">Print Table</button>
        </div>
    </div>

    <!-- Modal for Winners -->
      <div class="modal-container" id="winner-modal-container">
          <audio id="background-audio" loop>
              <source src="clap.mp3" type="audio/mpeg">
              Your browser does not support the audio element.
          </audio>
        <div class="modal" style="background: rgba(255, 255, 255, 0.3); /* Semi-transparent white */backdrop-filter: blur(10px); /* Blurs the background */width: 70%; height: 100%; padding: 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: space-between;">
              <div class="image-container" style="flex: 1; text-align: center;">
                  <img src="congrats.gif" alt="congrats" style="max-width: 100%; height: auto;">
              </div>
              <div style="flex: 2; text-align: center;">
                  <h2 style="font-size: 100px; color: #007BFF;">Congratulations!</h2>
                  <ul id="winners-list" style="list-style-type: none; padding: 0;font-size: 60px; color: white; text-align: center;"></ul>
                  <button class="button" id="close-modal" style="margin-top: 20px;">Close</button>
              </div>
              <div class="image-container" style="flex: 1; text-align: center;">
                  <img src="confetti.gif" alt="congrats" style="max-width: 100%; height: auto;">
              </div>
          </div>
          
      </div>
      
    <!-- Modal for Loading Screen -->
<div class="modal-container" id="loading-modal-container">
  <audio id="background-music" loop>
        <source src="roll.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <section>
      <div class="loader">
        <div class="dot" style="--i:0;"></div>
        <div class="dot" style="--i:1;"></div>
        <div class="dot" style="--i:2;"></div>
        <div class="dot" style="--i:3;"></div>
        <div class="dot" style="--i:4;"></div>
        <div class="dot" style="--i:5;"></div>
        <div class="dot" style="--i:6;"></div>
        <div class="dot" style="--i:7;"></div>
        <div class="dot" style="--i:8;"></div>
        <div class="dot" style="--i:9;"></div>
      </div>
      <div class="loader">
        <div class="dot" style="--i:0;"></div>
        <div class="dot" style="--i:1;"></div>
        <div class="dot" style="--i:2;"></div>
        <div class="dot" style="--i:3;"></div>
        <div class="dot" style="--i:4;"></div>
        <div class="dot" style="--i:5;"></div>
        <div class="dot" style="--i:6;"></div>
        <div class="dot" style="--i:7;"></div>
        <div class="dot" style="--i:8;"></div>
        <div class="dot" style="--i:9;"></div>
      </div>
    </section>
</div>

  <script>
    function printContent() {
    const originalTable = document.getElementById('winnersTable');
    const printTable = originalTable.cloneNode(true);
    
    // Create a new window for printing
    const printWindow = window.open('', '_blank');
    const styles = `
    <style>
        body { 
            font-family: Arial, sans-serif; 
            position: relative; 
            height: 100vh; /* Ensure full height */
            margin: 0; /* Remove default margin */
            padding: 20px; /* Add some padding */
        }
        h1 {
            text-align: center; /* Center the title */
            margin-bottom: 20px; /* Space below the title */
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin: 0 auto; /* Center the table */
        }
        th, td { 
            padding: 10px; 
            border: 1px solid #ddd; 
            text-align: left; 
        }
        th { 
            background-color: #007BFF; 
            color: white; /* Change text color for better contrast */
        }
        tr:nth-child(even) { 
            background-color: #f2f2f2; /* Zebra striping for better readability */
        }
        .watermark {
            position: fixed; /* Fixed position for printing */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('minergy.png'); /* Replace with your image path */
            background-size: contain; /* Scale to fit while maintaining aspect ratio */
            background-repeat: no-repeat;
            background-position: center; /* Center the image */
            opacity: 0.1; /* Adjust opacity as needed */
            pointer-events: none; /* Ensures the watermark does not interfere with interactions */
        }
        @media print {
            .watermark {
                /* Same styles for print */
            }
            body {
                padding: 0; /* Remove padding for print */
            }
            h1 {
                margin: 0; /* Remove margin for print */
            }
        }
    </style>
    `;

    // Create a new table for printing
    let printTableHTML = `
        <h1>Winners</h1>
        <table>
            <thead>
                <tr>
                    <th>Number</th>
                    <th>Name</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody>
    `;

    // Populate the new table with winners data
    const winners = JSON.parse(localStorage.getItem('winnersArray')) || [];
    winners.forEach((winner, index) => {
        printTableHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${winner.name}</td>
                <td>${winner.category}</td>
            </tr>
        `;
    });

    printTableHTML += `
            </tbody>
        </table>
    `;

    printWindow.document.write('<html><head><title>Print Table</title>' + styles + '</head><body>');
    printWindow.document.write('<div class="watermark"></div>'); // Add watermark div
    printWindow.document.write(printTableHTML);
    printWindow.document.write('</body></html>');
    printWindow.document.close(); 
    printWindow.print();
}

    document.addEventListener('DOMContentLoaded', function() {
      // Function to delete winners or participants based on keypress
          function deleteWinnersOnKeyPress(event) {
              if (event.shiftKey && event.key === '*') {
                  var winners = JSON.parse(localStorage.getItem('winnersArray')) || [];
                  if (winners.length > 0) {
                      localStorage.removeItem('winnersArray');
                      populateWinners();
                  }
              }
              if (event.shiftKey && event.key.toLowerCase() === 'p') {
                  var participants = JSON.parse(localStorage.getItem('participantsArray')) || [];
                  if (participants.length > 0) {
                      localStorage.removeItem('participantsArray');
                      populateParticipants();
                  }
              }
          }

          // Function to navigate back on keypress
          function goBackOnKeyPress(event) {
              if (event.shiftKey && event.key === '&') {
                  window.history.back(); // Navigate back to the last page
              }
          }

          // Add event listeners for keydown events
          document.addEventListener('keydown', function(event) {
              deleteWinnersOnKeyPress(event);
              goBackOnKeyPress(event);
          });
            // Initialize a variable to track the sort order
            let isAscending = true;

            function populateParticipants() {
                var participants = JSON.parse(localStorage.getItem('participantsArray')) || [];
                
                // Sort participants alphabetically by last name, then by first name
                participants.sort(function(a, b) {
                    var nameA = a.name.split(' ');
                    var nameB = b.name.split(' ');

                    var lastNameA = nameA[nameA.length - 1].toLowerCase();
                    var lastNameB = nameB[nameB.length - 1].toLowerCase();

                    if (lastNameA < lastNameB) return -1;
                    if (lastNameA > lastNameB) return 1;

                    var firstNameA = nameA[0].toLowerCase();
                    var firstNameB = nameB[0].toLowerCase();
                    return firstNameA.localeCompare(firstNameB);
                });
                
                var tableBody = document.getElementById('participantsTable');
                tableBody.innerHTML = ''; // Clear existing rows
                
                participants.forEach(function(participant, index) {
                    var nameParts = participant.name.split(' ');
                    var lastName = nameParts.pop(); // Get the last name
                    var firstName = nameParts.join(' '); // Join remaining parts as first name

                    var row = document.createElement('tr');
                    row.innerHTML = `<td>${index + 1}</td><td>${lastName}, ${firstName}</td>`;
                    tableBody.appendChild(row); // Append the new row
                });

                // Update the participant count after populating the table
                updateParticipantCount();
            }

            // Function to update the label with the current number of participants
            function updateParticipantCount() {
                const participantsTable = document.getElementById('participantsTable'); // Correctly reference the table body
                const rows = participantsTable.getElementsByTagName('tr');
                const currentCount = rows.length; // Current number of participants

                // Update the label text
                const remainsLabel = document.getElementById('remains');
                remainsLabel.textContent = `${currentCount} participant${currentCount !== 1 ? 's' : ''}`; // Pluralize if necessary
            }

            // Call populateParticipants to load participants on page load or whenever needed
            populateParticipants();

            document.getElementById('champ').addEventListener('click', selectWinner);

            function selectWinner() {
    var participants = JSON.parse(localStorage.getItem('participantsArray')) || [];
    var numWinners = parseInt(document.getElementById('num-winners').value);
    var winnerOption = document.getElementById('winner-options').value; // Get the selected category

    if (participants.length === 0) {
        alert("No participants left!");
        return;
    }

    if (numWinners <= 0 || numWinners > participants.length) {
        alert("Invalid number of winners!");
        return;
    }

    var loadingModalContainer = document.getElementById('loading-modal-container');
    loadingModalContainer.style.display = 'block';

    var winnerModalContainer = document.getElementById('winner-modal-container');
    winnerModalContainer.style.display = 'none'; // Hide the winner modal initially

    var currentWinners = [];
    for (var i = 0; i < numWinners; i++) {
        var randomIndex = Math.floor(Math.random() * participants.length);
        var winner = participants[randomIndex];
        participants.splice(randomIndex, 1);
        currentWinners.push({
            name: winner.name,
            category: winnerOption // Assign the selected category to the winner
        });
    }

    // Function to show the winner modal and play audio
    function showWinnerModal() {
        const winnerModalContainer = document.getElementById('winner-modal-container');
        const audio = document.getElementById('background-audio');

        winnerModalContainer.style.display = 'flex'; // Show the winner modal
        audio.play().catch(function(error) {
            console.error("Audio playback failed:", error);
        }); // Play the background audio
    }

    // Function to hide the winner modal and stop audio
    function hideWinnerModal() {
        const winnerModalContainer = document.getElementById('winner-modal-container');
        const audio = document.getElementById('background-audio');

        winnerModalContainer.style.display = 'none'; // Hide the winner modal
        audio.pause(); // Pause the background audio
        audio.currentTime = 0; // Reset the audio to the beginning
    }

    // Event listener for the close button
    document.getElementById('close-modal').addEventListener('click', hideWinnerModal);

    // Function to show the loading modal and play music
    function showLoadingModal() {
        const loadingModalContainer = document.getElementById('loading-modal-container');
        const music = document.getElementById('background-music');

        loadingModalContainer.style.display = 'block'; // Show the loading modal
        music.play(); // Play the background music
    }

    // Function to hide the loading modal and stop music
    function hideLoadingModal() {
        const loadingModalContainer = document.getElementById('loading-modal-container');
        const music = document.getElementById('background-music');

        loadingModalContainer.style.display = 'none'; // Hide the loading modal
        music.pause(); // Pause the background music
        music.currentTime = 0; // Reset the music to the beginning
    }

    // Example function to handle the loading and winner display
    function handleLoadingAndWinners() {
        showLoadingModal(); // Show the loading modal and play music

        setTimeout(function() {
            hideLoadingModal(); // Hide the loading modal and stop music
            showWinnerModal(); // Show the winner modal and play audio
            var winnerList = document.getElementById('winners-list');

            // Get existing winners from local storage
            var existingWinners = JSON.parse(localStorage.getItem('winnersArray')) || [];

            // Clear the winner list in the modal
            winnerList.innerHTML = '';

            // Display only the current winners in the modal
            currentWinners.forEach(function(winner, index) {
                var listItem = document.createElement('li');
                listItem.textContent = `${index + 1}. ${winner.name}`; // Add category to the display
                winnerList.appendChild(listItem);
            });

            // Update the winners array in local storage with both existing and current winners
            var allWinners = existingWinners.concat(currentWinners);
            localStorage.setItem('participantsArray', JSON.stringify(participants));
            localStorage.setItem('winnersArray', JSON.stringify(allWinners)); // Store the updated winners

            populateParticipants();
            populateWinners();
        }, 4000);
    }

    // Call the function to handle loading and winners
    handleLoadingAndWinners();
}

            function populateWinners() {
              var winners = JSON.parse(localStorage.getItem('winnersArray')) || [];
              var tableBody = document.getElementById('winnersTable');
              tableBody.innerHTML = ''; // Clear existing rows
              
              // Populate the winners table with existing winners
              winners.forEach(function(winner, index) {
                  var nameParts = winner.name.split(' ');
                  var lastName = nameParts.pop(); // Get the last name
                  var firstName = nameParts.join(' '); // Join remaining parts as first name

                  var row = document.createElement('tr');
                  row.innerHTML = `<td>${index + 1}</td><td>${lastName}, ${firstName}</td><td>${winner.category}</td>`;
                  tableBody.appendChild(row); // Append the new row
              });
          }

            document.getElementById('close-modal').addEventListener('click', function () {
                document.getElementById('winner-modal-container').style.display = 'none';
            });

            // Populate participants and winners on page load
            populateParticipants();
            populateWinners();
        });
        
</script>
</body>
</html>
